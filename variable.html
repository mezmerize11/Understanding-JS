<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
</head>
<body>
    <button onclick="console.log(`Cart Quantity : ${quantity}`)">Show Quantity</button>
    <button onclick="quantity = quantity + 1; console.log(`1 is added on the cart: Total now is = ${quantity}`)" class="add2cart">Add to Cart</button>
    <button class="plus2">+2</button>
    <button class="plus3">+3</button>
    <button class="resetbtn">Reset Button</button>
</body>
<script src="app.js"></script>
</html>
